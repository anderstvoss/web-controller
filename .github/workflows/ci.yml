name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-lint:
    name: Rust lint
    # All remote-CI jobs are gated on the repo being public.
    # While private, rely on the local pre-commit / pre-push hooks for
    # the same gates (cargo fmt, clippy, check, test, deny, audit,
    # gitleaks). Skipping at job level costs zero runner time and the
    # jobs auto-activate the moment the repo flips to public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        # The SHA-pinned dtolnay/rust-toolchain at this revision
        # requires an explicit toolchain input — it does not fall back
        # to reading rust-toolchain.toml. `stable` is a baseline; the
        # actual cargo invocations honour rust-toolchain.toml at the
        # repo root via rustup, so the pinned channel still drives
        # what runs.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (cargo check on rust-version)
    # Verifies the crate still builds on the rust-version declared in
    # Cargo.toml — catches accidental MSRV breakage on dep updates.
    # Uses an explicit `with: toolchain: …` input to override the
    # rust-toolchain.toml pin for this one job.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(
            awk -F'"' '
              $0 == "[workspace.package]" { in_workspace = 1; next }
              /^\[/ && $0 != "[workspace.package]" { in_workspace = 0 }
              in_workspace && $1 ~ /^rust-version[[:space:]]*=[[:space:]]*$/ { print $2; exit }
            ' Cargo.toml
          )
          if [ -z "$MSRV" ]; then
            MSRV=$(grep -m1 '^rust-version = "' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          if [ -z "$MSRV" ]; then
            echo "ERROR: could not parse rust-version from Cargo.toml" >&2
            exit 1
          fi
          echo "msrv=$MSRV" >> "$GITHUB_OUTPUT"
          echo "MSRV: $MSRV"

      - name: Install Rust at MSRV
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-${{ steps.msrv.outputs.msrv }}

      - name: cargo check at MSRV
        # rust-toolchain.toml would otherwise override the MSRV toolchain
        # and the check would silently run on the pinned channel.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.msrv }}
        run: |
          rustc --version
          cargo --version
          test "$(rustc --version | cut -d' ' -f2 | cut -d. -f1-2)" = "$RUSTUP_TOOLCHAIN"
          cargo check --locked --workspace --all-targets --all-features

  rust-test:
    name: Rust build and test (${{ matrix.os }})
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Linux-only service (it drives /dev/uinput and /dev/uhid through
        # virtualgamepad), so tests run on Ubuntu only. The policy job
        # keeps its three-OS matrix because contributors' hooks run there.
        os: [ubuntu-latest]

    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # The harden-runner pre-step ignores the step-level `if`, so it
          # also runs on macOS and Windows runners. Block mode there drops
          # OCSP/CRL and DNS lookups (schannel CRYPT_E_REVOCATION_OFFLINE
          # during cargo fetch); keep block on Linux and audit elsewhere.
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        # See rust-lint job's Install Rust step for rationale.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Windows runners intermittently fail crate downloads with schannel
      # CRYPT_E_REVOCATION_OFFLINE. Fetch with a bounded retry before
      # building. Revocation checking stays on: never set
      # CARGO_HTTP_CHECK_REVOCATION=false or use a mirror here.
      - name: Fetch crates (bounded retry)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::cargo fetch attempt $attempt of 3 failed; retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            fi
          done
          echo "::error::cargo fetch failed after 3 attempts"
          exit 1

      - name: Check build
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Test
        run: cargo test --locked --workspace --all-features

  policy:
    name: Policy checks (${{ matrix.os }})
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # cargo-* hooks are covered by the rust-lint / rust-test jobs.
      # gitleaks pre-commit hook installs gitleaks via Go (language:
      # golang), which would need go.dev / proxy.golang.org /
      # sum.golang.org / storage.googleapis.com in the harden-runner
      # allowlist. Skip it here — gitleaks-history.yml runs a
      # dedicated full-history gitleaks scan on the same triggers,
      # which is the authoritative coverage.
      SKIP: cargo-fmt,cargo-check,cargo-clippy,cargo-test,gitleaks

    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # The harden-runner pre-step ignores the step-level `if`, so it
          # also runs on macOS and Windows runners. Block mode there drops
          # OCSP/CRL and DNS lookups (schannel CRYPT_E_REVOCATION_OFFLINE
          # during cargo fetch); keep block on Linux and audit elsewhere.
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install pre-commit (hash-locked)
        # All deps and their transitive deps pinned to specific versions
        # and sha256 hashes in .github/requirements/pre-commit.txt
        # (generated by `uv pip compile --generate-hashes`). Satisfies
        # OpenSSF Scorecard's Pinned-Dependencies check for pip.
        # Regenerate by editing .github/requirements/pre-commit.in and
        # re-running uv pip compile.
        run: python -m pip install --require-hashes --no-deps -r .github/requirements/pre-commit.txt

      - name: Run policy hooks
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit-cache
        run: python -m pre_commit run --all-files --show-diff-on-failure --color=always

  disclosure:
    name: Disclosure checks
    # A public repository publishes every branch, tag and pull-request
    # head, so this scans all of them rather than only the checked-out
    # tree: every historical file version against the same patterns as
    # the pre-commit blockers, and every commit author/committer email
    # (anything other than a GitHub or bot noreply address fails).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull-request heads
        # fetch-depth 0 already brings every branch and tag.
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/prs/*'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: History guard (every reachable file version and commit identity)
        run: python scripts/history_guard.py --identities fail

  supply-chain:
    name: Supply chain audit
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        # See rust-lint job's Install Rust step for rationale.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      - name: cargo-audit
        # The archived action installs cargo-audit without --locked; its
        # dependency resolution now exceeds the runner's Rust version.
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # actions/dependency-review-action fetches the dependency
          # compare from api.github.com, license/advisory lookups via
          # the same host, and action assets from
          # objects.githubusercontent.com (plus blob/CDN fallbacks).
          # It also calls api.deps.dev for dependency metadata and
          # api.securityscorecards.dev for OSSF Scorecard scoring on
          # each package (see src/scorecard.ts in the action). Both
          # are required or the action fails with a generic
          # "fetch failed".
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  python-scripts:
    name: Python script tests
    # Python helpers under scripts/ are lint-gated by the ruff hook in the
    # policy job. This runs their unittest suite (scripts/tests/test_*.py)
    # and passes with a notice when the repo has no Python helpers yet.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Run script unit tests
        run: |
          if [ ! -d scripts/tests ]; then
            echo "::notice::No scripts/tests directory; nothing to run."
            exit 0
          fi
          python -m unittest discover -v -s scripts/tests
