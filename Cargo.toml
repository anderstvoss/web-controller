[package]
name = "web-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Serves a local web page that turns smartphones into Linux virtual game controllers through virtualgamepad."
repository = "https://github.com/anderstvoss/web-controller"
readme = "README.md"
keywords = ["gamepad", "controller", "uinput", "websocket", "linux"]
categories = ["hardware-support"]
publish = false

[dependencies]
axum = { version = "0.8.6", features = ["ws"] }
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
subtle = "2.6.1"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
virtualgamepad = { git = "https://github.com/anderstvoss/virtualgamepad", rev = "9e00a063586568a059ca5e91976c5e829c20fbae" }

[dev-dependencies]
proptest = "1.9.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
