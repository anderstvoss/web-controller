[package]
name = "web-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Serves a local web page that turns smartphones into Linux virtual game controllers through virtualgamepad."
repository = "https://github.com/anderstvoss/web-controller"
readme = "README.md"
keywords = ["gamepad", "controller", "uinput", "websocket", "linux"]
categories = ["hardware-support"]
publish = false

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Keeps unsafe auditable if a crate later needs FFI and relaxes the
# forbid above to deny + per-crate allow.
undocumented_unsafe_blocks = "deny"
