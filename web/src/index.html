<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Web Controller</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.mjs"></script>
  </head>
  <body>
    <header>
      <h1>Web Controller</h1>
      <span id="status" role="status" aria-live="polite">Not connected</span>
    </header>
    <section id="pair-view" class="pair-view">
      <h2>Pair a controller</h2>
      <p>
        Scan the host’s QR invite, enter its one-time PIN, or request approval.
        This page requires a trusted HTTPS connection.
      </p>
      <form id="pair-form">
        <label for="pair-code">Pairing code</label>
        <input
          id="pair-code"
          name="code"
          type="text"
          inputmode="numeric"
          minlength="8"
          maxlength="9"
          placeholder="0000-0000"
          autocomplete="off"
          required
        />
        <button type="submit">Connect controller</button>
      </form>
      <button id="request-join" type="button">Request to join</button>
      <p id="pair-error" role="alert"></p>
    </section>
    <main
      id="controller"
      class="controller hidden"
      aria-label="Xbox 360-style touchscreen controller"
    >
      <section class="shoulders" aria-label="Shoulder controls">
        <div class="shoulder">
          <button type="button" class="touchbutton trigger" data-trigger="0">
            LT
          </button>
          <button type="button" class="touchbutton" data-button="4">LB</button>
        </div>
        <div class="shoulder">
          <button type="button" class="touchbutton trigger" data-trigger="1">
            RT
          </button>
          <button type="button" class="touchbutton" data-button="5">RB</button>
        </div>
      </section>
      <section class="play-area">
        <div class="left-cluster">
          <div
            class="stick"
            data-stick="0"
            role="group"
            aria-label="Left analog stick"
          >
            <div class="stick-knob"></div>
          </div>
          <div class="dpad" role="group" aria-label="Directional pad">
            <button
              type="button"
              data-button="11"
              class="touchbutton up"
              aria-label="D-pad up"
            >
              ▲
            </button>
            <button
              type="button"
              data-button="13"
              class="touchbutton left"
              aria-label="D-pad left"
            >
              ◀
            </button>
            <button
              type="button"
              data-button="14"
              class="touchbutton right"
              aria-label="D-pad right"
            >
              ▶
            </button>
            <button
              type="button"
              data-button="12"
              class="touchbutton down"
              aria-label="D-pad down"
            >
              ▼
            </button>
          </div>
        </div>
        <div class="middle-cluster">
          <button type="button" class="touchbutton auxiliary" data-button="6">
            Back
          </button>
          <button type="button" class="touchbutton auxiliary" data-button="8">
            Guide
          </button>
          <button type="button" class="touchbutton auxiliary" data-button="7">
            Start
          </button>
          <div class="stick-press">
            <button type="button" class="touchbutton auxiliary" data-button="9">
              L3
            </button>
            <button
              type="button"
              class="touchbutton auxiliary"
              data-button="10"
            >
              R3
            </button>
          </div>
        </div>
        <div class="right-cluster">
          <div class="face" role="group" aria-label="Face buttons">
            <button type="button" data-button="3" class="touchbutton y">
              Y
            </button>
            <button type="button" data-button="2" class="touchbutton x">
              X
            </button>
            <button type="button" data-button="1" class="touchbutton b">
              B
            </button>
            <button type="button" data-button="0" class="touchbutton a">
              A
            </button>
          </div>
          <div
            class="stick"
            data-stick="1"
            role="group"
            aria-label="Right analog stick"
          >
            <div class="stick-knob"></div>
          </div>
        </div>
      </section>
      <p class="hint">
        Keep this page visible. Switching apps or locking the phone releases all
        controls.
      </p>
      <button id="end-session" type="button">End session</button>
    </main>
  </body>
</html>
